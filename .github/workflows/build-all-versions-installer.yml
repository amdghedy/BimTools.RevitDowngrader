name: Build all Revit versions and installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/master-installer-all-revit-versions
    paths:
      - "Downgrader.*/**"
      - "Shared/**"
      - "installer/**"
      - "RevitDowngrader.AllVersions.sln"
      - ".github/workflows/build-all-versions-installer.yml"

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and stage all versions
        shell: pwsh
        run: ./installer/build-installer-payload.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\RevitDowngrader.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload installer and portable payload
        uses: actions/upload-artifact@v4
        with:
          name: BIMTOOLS-RevitDowngrader-AllVersions
          path: |
            installer/output/*.exe
            installer/payload/**
          if-no-files-found: error
          retention-days: 30
